<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>TChat - Lightweight Mode </title>

<style type="text/css">
html, body {
    margin: 0;
    padding: 0;
    background: #fff;
    color: #000;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 18px;
}

#header {
    padding: 12px 8px;
    border-bottom: 2px solid #000;
}

#title {
    font-size: 28px;
    font-weight: bold;
}

#room {
    margin-top: 5px;
    font-size: 16px;
}

#messages {
    padding: 8px;
    margin-bottom: 125px;
}

.message {
    padding: 10px 2px;
    border-bottom: 1px solid #888;
}

.name {
    font-weight: bold;
}

.time {
    float: right;
    color: #555;
    font-size: 14px;
}

.text {
    margin-top: 5px;
    line-height: 1.35;
    white-space: pre-wrap;
    word-wrap: break-word;
}

#status {
    padding: 8px;
    border-top: 1px solid #888;
    background: #eee;
    font-size: 14px;
}

#composer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 8px;
    background: #fff;
    border-top: 2px solid #000;
}

#name,
#text {
    width: 100%;
    box-sizing: border-box;
    padding: 8px;
    margin-bottom: 6px;
    border: 2px solid #000;
    background: #fff;
    color: #000;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 20px;
}

#text {
    height: 55px;
}

#send {
    width: 100%;
    padding: 10px;
    border: 2px solid #000;
    background: #000;
    color: #fff;
    font-size: 22px;
    font-weight: bold;
}

#notice {
    padding: 8px;
    border-bottom: 1px solid #888;
    font-size: 14px;
}
</style>
</head>

<body>

<div id="header">
    <div id="title">TChat</div>
    <div id="room">Lightweight Mode</div>
</div>

<div id="notice">
    Lightweight TChat mode for older browsers.
</div>

<div id="messages"></div>

<div id="status">
    Lightweight mode loaded.
</div>

<div id="composer">
    <input id="name" type="text" maxlength="30" placeholder="Your name">
    <textarea id="text" maxlength="2000" placeholder="Write a message..."></textarea>
    <button id="send" type="button">SEND</button>
</div>

<script type="text/javascript">
/*
This page is the Lightweight-mode target.

It currently has a local test composer so you can verify:
1. the old-browser detector redirects here
2. the browser UI works
3. messages render without modern JavaScript

The real multiplayer transport should be added separately using
simple HTTP requests/polling rather than the WebSocket transport
used by the full TChat application.
*/

(function () {
    "use strict";

    function getQuery(name) {
        var query = window.location.search.substring(1);
        var parts = query.split("&");
        var i;
        var pair;
        var key;

        for (i = 0; i < parts.length; i += 1) {
            pair = parts[i].split("=");
            key = decodeURIComponent(pair[0] || "");

            if (key === name) {
                return decodeURIComponent(pair[1] || "");
            }
        }

        return "";
    }

    function addMessage(name, text, time) {
        var messages = document.getElementById("messages");
        var row = document.createElement("div");
        var nameEl = document.createElement("div");
        var timeEl = document.createElement("span");
        var textEl = document.createElement("div");

        row.className = "message";
        nameEl.className = "name";
        timeEl.className = "time";
        textEl.className = "text";

        nameEl.appendChild(
            document.createTextNode(name || "Anonymous")
        );

        timeEl.appendChild(
            document.createTextNode(time || "")
        );

        nameEl.appendChild(timeEl);

        textEl.appendChild(
            document.createTextNode(text || "")
        );

        row.appendChild(nameEl);
        row.appendChild(textEl);

        messages.appendChild(row);

        try {
            window.scrollTo(0, document.body.scrollHeight);
        } catch (e) {}
    }

    var room = getQuery("room") || "my-room";
    var savedName = "";

    try {
        savedName = window.localStorage.getItem("writing_name") || "";
    } catch (e) {
        savedName = "";
    }

    document.getElementById("room").appendChild(
        document.createTextNode("Room: " + room)
    );

    document.getElementById("name").value = savedName;

    document.getElementById("send").onclick = function () {
        var nameBox = document.getElementById("name");
        var textBox = document.getElementById("text");
        var name = nameBox.value.replace(/^\s+|\s+$/g, "");
        var text = textBox.value.replace(/^\s+|\s+$/g, "");
        var now;
        var hh;
        var mm;

        if (!name) {
            name = "Anonymous";
        }

        if (!text) {
            return;
        }

        try {
            window.localStorage.setItem("writing_name", name);
        } catch (e) {}

        now = new Date();
        hh = String(now.getHours());
        mm = String(now.getMinutes());

        if (hh.length < 2) {
            hh = "0" + hh;
        }

        if (mm.length < 2) {
            mm = "0" + mm;
        }

        addMessage(name, text, hh + ":" + mm);

        textBox.value = "";
        textBox.focus();
    };

    document.getElementById("text").onkeypress = function (event) {
        event = event || window.event;

        if (event.keyCode === 13) {
            if (event.preventDefault) {
                event.preventDefault();
            }

            document.getElementById("send").click();
            return false;
        }

        return true;
    };

    document.getElementById("status").innerHTML =
        "Lightweight Mode active. Room: " + room;
}());
</script>

</body>
</html>
